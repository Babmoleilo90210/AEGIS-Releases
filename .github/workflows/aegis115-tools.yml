name: AEGIS 1.1.5 isolated build toolchain
on:
  push:
    branches: [development/aegis-1.1.5]
    paths: [.github/workflows/aegis115-tools.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified native test dependencies and Java 21
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,shutil,subprocess,tarfile,urllib.request
          work=pathlib.Path(os.environ['RUNNER_TEMP'])/'aegis115-toolchain';work.mkdir()
          image=work/'base.AppImage'
          with urllib.request.urlopen('https://github.com/Babmoleilo90210/AEGIS-Releases/releases/download/v1.1.1/AEGIS-1.1.1-CachyOS-x86_64.AppImage',timeout=60) as response,image.open('wb') as target:shutil.copyfileobj(response,target)
          assert hashlib.file_digest(image.open('rb'),'sha256').hexdigest()=='7c471e7baf9f82d4198a2daaaadd498937bdc31b0595dec8b4dba286d312b3d3'
          image.chmod(0o755);subprocess.run([str(image),'--appimage-extract'],cwd=work,check=True,stdout=subprocess.DEVNULL,timeout=90)
          spec=importlib.util.spec_from_file_location('build_demo',pathlib.Path('aegis/tools/build-demo.py'));module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          deps=work/'deps';deps.mkdir()
          for coordinate,digest in module.MAVEN.items():module.download('https://repo.maven.apache.org/maven2/'+coordinate,deps/pathlib.PurePosixPath(coordinate).name,digest)
          out=pathlib.Path('toolchain-output');out.mkdir()
          jdk=pathlib.Path(os.environ['JAVA_HOME_21_X64']);version=subprocess.check_output([str(jdk/'bin/java'),'-version'],stderr=subprocess.STDOUT,text=True,timeout=10)
          (out/'TOOLCHAIN-PROVENANCE.json').write_text(json.dumps({'JDK':version,'source':'GitHub hosted Ubuntu runner preinstalled Java 21','nativeBase':'published AEGIS v1.1.1, SHA verified','dependencies':module.MAVEN,'productionChanged':False},indent=2))
          with tarfile.open(out/'aegis115-build-toolchain.tar.gz','w:gz',compresslevel=3) as archive:
            archive.add(jdk,arcname='jdk');archive.add(deps,arcname='deps')
            for name in ['app','native','tor']:archive.add(work/'squashfs-root'/name,arcname='native-base/'+name)
          (out/'SHA256SUMS').write_text(hashlib.file_digest((out/'aegis115-build-toolchain.tar.gz').open('rb'),'sha256').hexdigest()+'  aegis115-build-toolchain.tar.gz\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AEGIS-1.1.5-build-toolchain
          path: toolchain-output/
          retention-days: 7
