name: AEGIS 1.5.0 isolated development toolchain
on:
  push:
    branches: [development/aegis-1.5.0]
    paths: [.github/workflows/aegis150-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare Java21 and verified local test/PDF libraries
        shell: bash
        run: |
          mkdir -p toolchain/deps
          tar -czf toolchain/jdk21.tar.gz --exclude=lib/src.zip -C "$JAVA_HOME_21_X64" .
          python3 - <<'PY'
          import urllib.request,pathlib,hashlib,json
          root=pathlib.Path('toolchain/deps')
          coords=[
            'org/junit/platform/junit-platform-console-standalone/1.13.4/junit-platform-console-standalone-1.13.4.jar',
            'org/testfx/openjfx-monocle/21.0.2/openjfx-monocle-21.0.2.jar',
            'com/password4j/password4j/1.8.4/password4j-1.8.4.jar',
            'org/xerial/sqlite-jdbc/3.53.4.0/sqlite-jdbc-3.53.4.0.jar',
            'org/slf4j/slf4j-api/2.0.17/slf4j-api-2.0.17.jar',
            'org/slf4j/slf4j-nop/2.0.17/slf4j-nop-2.0.17.jar',
            'org/apache/pdfbox/pdfbox/3.0.8/pdfbox-3.0.8.jar',
            'org/apache/pdfbox/pdfbox-io/3.0.8/pdfbox-io-3.0.8.jar',
            'org/apache/pdfbox/fontbox/3.0.8/fontbox-3.0.8.jar',
            'commons-logging/commons-logging/1.3.5/commons-logging-1.3.5.jar']
          hashes={}
          for c in coords:
            url='https://repo.maven.apache.org/maven2/'+c
            with urllib.request.urlopen(url,timeout=35) as s:data=s.read(20*1024*1024)
            name=c.rsplit('/',1)[-1]
            if name.startswith(('pdfbox-','fontbox-')):
              with urllib.request.urlopen('https://downloads.apache.org/pdfbox/3.0.8/'+name+'.sha512',timeout=35) as s:expected=s.read().decode().split()[0]
              assert hashlib.sha512(data).hexdigest()==expected
            (root/name).write_bytes(data);hashes[name]=hashlib.sha256(data).hexdigest()
          hashes['jdk21.tar.gz']=hashlib.sha256(pathlib.Path('toolchain/jdk21.tar.gz').read_bytes()).hexdigest()
          pathlib.Path('toolchain/SHA256.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AEGIS-1.5.0-development-toolchain
          path: toolchain/
          retention-days: 7
