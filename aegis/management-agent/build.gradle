plugins { id 'application' }
dependencies {
    implementation project(':common-protocol')
    implementation project(':attachment-service')
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
    testImplementation project(':identity-server')
}
application {
    mainClass = 'org.securemail.management.ManagementMain'
    applicationDefaultJvmArgs = ['-Xms16m', '-Xmx96m', '-XX:+DisableAttachMechanism', '-XX:-HeapDumpOnOutOfMemoryError']
}
