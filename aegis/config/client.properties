# AEGIS client. No passwords or private keys in this file.
torSocksAddress=127.0.0.1
torSocksPort=19050
torControlPort=19051
torCookiePath=~/.local/share/aegis-tor/control_auth_cookie
localServicePort=19120
defaultTTL=1800
# Set your own relay onion v3 address. No vendor/default server exists.
relayOnionAddress=
relayPort=80
storagePath=~/.local/share/aegis
maxFileSize=16777216
maxLocalStorage=268435456
deliveryTTL=604800000
