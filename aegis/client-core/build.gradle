dependencies {
    api project(':common-protocol')
    testImplementation project(':identity-server')
    testImplementation project(':management-agent')
    testImplementation project(':attachment-service')
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'net.java.dev.jna:jna:5.19.1'
    implementation 'net.java.dev.jna:jna-platform:5.19.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.14.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.12'
    // Official Tor Browser detached OpenPGP distribution signatures only.
    implementation 'org.bouncycastle:bcpg-jdk18on:1.86'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.86'
    implementation 'com.google.crypto.tink:tink:1.23.0'
    // Local bounded PDF renderer; no network or cloud document service.
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
}

tasks.withType(Test).configureEach { systemProperty "aegis.native.root", rootProject.file(".native-test").absolutePath }
tasks.register('prepareNative', Exec) {
    workingDir rootProject.projectDir
    commandLine System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3', 'packaging/prepare-native.py'
    onlyIf { !rootProject.file('.native-test/native/libsodium.' + (System.getProperty('os.name').startsWith('Windows') ? 'dll' : 'so')).exists() }
}
tasks.withType(Test).configureEach { dependsOn tasks.named('prepareNative') }

tasks.register('torProcessSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.securemail.client.TorProcessSmoke'
    args providers.gradleProperty('torBundle').getOrElse('.')
}

// Explicit owner-side acceptance utilities; not part of production application JAR/classpath.
tasks.register('nativeAcceptanceJar', Jar) {
    dependsOn testClasses
    archiveFileName = 'aegis-native-tests.jar'
    from sourceSets.test.output
    include 'org/securemail/client/security/NativeAcceptanceMain*.class'
    include 'org/securemail/client/security/NativeCredentialStoreSmoke*.class'
}
